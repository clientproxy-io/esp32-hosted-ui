[platformio]
default_envs = esp32-s3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@^7.4.2

[env:esp32-s3]
board = esp32-s3-devkitc-1
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32dev]
board = esp32dev

[env:esp32c3]
board = esp32-c3-devkitm-1
